name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - name: Verify tag matches manifest version and build zip
        run: node scripts/build-zip.js --check-tag "$GITHUB_REF_NAME"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/seiton-*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/seiton-*.zip --title "$GITHUB_REF_NAME" --generate-notes
          fi
