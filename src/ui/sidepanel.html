<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>seiton</title>
  <link rel="icon" href="../../icons/icon32.png">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="appbar">
    <div class="brand"><img src="../../icons/logo.png" alt="" width="40" height="40">seiton</div>
    <span class="grow"></span>
    <button id="sessions" title="セッション（ワークスペースごとに使うアカウント / ログイン状態のラベル）を管理">セッション</button>
    <button id="discard" title="このウィンドウの非アクティブなタブのメモリを解放（タブは残ります）">非アクティブなタブを休止</button>
    <button id="guide" class="icon" title="使い方">?</button>
    <button id="options" class="icon" title="設定">⚙</button>
  </header>

  <div class="searchbar">
    <div class="search-wrap">
      <input id="search" type="search" placeholder="ワークスペース・ブックマーク・閲覧履歴を検索（/ でここにフォーカス）" autocomplete="off" autofocus>
      <div id="searchResults" hidden></div>
    </div>
    <span class="muted small search-hint">↑↓ 選択 / Enter 開く / Shift+Enter ワークスペース→新しいウィンドウ・URL→このウィンドウ / Esc 検索を消す・パネルを閉じる / 1〜9/0 でワークスペース切替（Shift で新しいウィンドウ）</span>
  </div>

  <div class="board">
    <aside class="col col-ws">
      <div class="col-title row">
        <span class="grow">ワークスペース</span>
        <button id="createOpen" class="icon plus" type="button" title="新しいワークスペースを作成">＋</button>
      </div>
      <div id="list" class="col-body"></div>
    </aside>

    <div class="stage">
      <div id="detailHead"></div>
      <div id="editor"></div>
      <div class="split">
        <section class="col">
          <h2 class="col-title" id="bmTitle">ブックマーク</h2>
          <div id="bookmarks" class="col-body"></div>
        </section>
        <section class="col">
          <h2 class="col-title" id="tabTitle">タブ</h2>
          <div id="tabs" class="col-body"></div>
        </section>
      </div>
    </div>
  </div>

  <dialog id="createDialog">
    <form id="createForm">
      <div class="dlg-head">新しいワークスペース</div>
      <div class="dlg-body">
        <label class="field">
          <span>名前</span>
          <input id="createName" type="text" placeholder="例: 案件A / AWS 本番" autocomplete="off">
        </label>
        <div class="field">
          <span>アイコン</span>
          <div id="createIcon"></div>
        </div>
        <label class="field">
          <span>使うセッション</span>
          <select id="createSession"></select>
        </label>
        <label class="field">
          <span>ブックマークフォルダ</span>
          <select id="createFolder">
            <option value="new">新しいフォルダを作成して接続</option>
            <option value="">接続しない</option>
          </select>
        </label>
        <label class="check" id="createKeepRow"><input id="createKeep" type="checkbox" checked> このウィンドウで今開いているタブをこのワークスペースにする</label>
        <div id="createHint" class="muted small"></div>
      </div>
      <div class="dlg-foot">
        <button type="button" id="createCancel">キャンセル</button>
        <button type="submit" class="primary">作成</button>
      </div>
    </form>
  </dialog>

  <dialog id="sessionDialog">
    <div class="dlg-head">
      <span class="grow">セッション</span>
      <button type="button" class="icon" id="sessionClose" title="閉じる">×</button>
    </div>
    <div class="dlg-body">
      <div class="muted small">ワークスペースが「どのアカウント / ログイン状態で使うか」を表すラベルです。各ワークスペースの ✎ から使うセッションを選びます。</div>
      <div id="sessionList"></div>
      <form id="sessionAdd" class="row">
        <input id="sessionName" type="text" class="grow" placeholder="新しいセッション名（例: AWS 開発アカウント）" autocomplete="off">
        <button type="submit">追加</button>
      </form>
    </div>
  </dialog>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
